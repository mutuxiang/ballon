<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>鼓足气 · puffo-pump!</title><link rel="stylesheet" href="pet-menu.css"></head>
<body><main class="menu" aria-label="桌宠操作">
  <header><span class="dot"></span><span>鼓足气</span><span class="mark">puffo-pump!</span></header>
  <nav aria-label="桌宠菜单">
    <button class="entry exercise" data-action="exercise"><span class="icon">↗</span><span>打开运动模式</span><span class="arrow">↗</span></button>
    <button class="entry" data-panel="custom" aria-expanded="false" aria-controls="custom"><span class="icon pink"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5 4 4M4 20l4-1L20 7a2.8 2.8 0 0 0-4-4L4 15z"/></svg></span><span>自定义</span><span class="arrow">›</span></button>
    <div id="custom" class="submenu" hidden><button data-action="custom">拍照取色</button><button data-action="reset">恢复原始配色</button></div>
    <button class="entry" data-panel="themes" aria-expanded="false" aria-controls="themes"><span class="icon teal"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 3-5 3-2 5 4 2 2-3v11h10V10l2 3 4-2-2-5-5-3c0 2-1.5 3-4 3S8 5 8 3Z"/></svg></span><span>换皮肤</span><span class="arrow">›</span></button>
    <div id="themes" class="submenu choices" hidden></div>
    <button class="entry" data-panel="sizes" aria-expanded="false" aria-controls="sizes"><span class="icon blue">↔</span><span>桌宠大小</span><span class="arrow">›</span></button>
    <div id="sizes" class="submenu choices" hidden></div>
    <div class="divider"></div>
    <button class="entry exit" data-action="quit"><span class="icon">⏻</span><span>退出桌宠</span></button>
  </nav><p id="error" role="status" hidden></p>
</main><script src="pet-menu.js"></script></body></html>
