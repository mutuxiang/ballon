<!doctype html>
<meta charset="utf-8">
<style>
  html,body{margin:0;background:transparent;overflow:hidden}
  canvas{display:block}
</style>
<canvas></canvas>
<script type="module">
import {createFocusEffects} from '../dist/focus-effects.js';
const canvas = document.querySelector('canvas');
const context = canvas.getContext('2d');
const query = new URLSearchParams(location.search);
const x = Number(query.get('x'));
const y = Number(query.get('y'));
canvas.width = innerWidth * devicePixelRatio;
canvas.height = innerHeight * devicePixelRatio;
context.scale(devicePixelRatio, devicePixelRatio);
const effects = createFocusEffects(context, '../dist/focus-comic-atlas.png');
effects.burst(x, y, Math.min(innerWidth, innerHeight) * .13, 7);
const reach = Math.max(Math.hypot(x,y),Math.hypot(innerWidth-x,y),
  Math.hypot(x,innerHeight-y),Math.hypot(innerWidth-x,innerHeight-y)) + 40;
let start, previous;
function draw(now) {
  start ??= now;
  previous ??= now;
  const dt = Math.min((now - previous) / 1000, .05);
  previous = now;
  const progress = Math.min(1, (now - start) / 1800);
  context.clearRect(0,0,innerWidth,innerHeight);
  context.save();
  context.globalAlpha = Math.pow(1-progress,.7);
  const radius = 25 + reach * (1-Math.pow(1-progress,1.6));
  for (const [width,color] of [[7,'#fffdf1'],[3,'#252525']]) {
    context.beginPath();
    context.arc(x,y,radius,0,Math.PI*2);
    context.strokeStyle=color;
    context.lineWidth=width;
    context.stroke();
  }
  context.restore();
  effects.draw(dt,innerWidth,innerHeight);
  if(progress<1)requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script>
