<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>下班保卫战 · AIR / PLAY</title>  <script type="module" crossorigin src="./assets/play-CRk_5Qk1.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/clothing-BsQRIaWu.js">
  <link rel="stylesheet" crossorigin href="./assets/play-Cbz98lpG.css">
</head>
<body><main id="game"><div id="world" aria-hidden="true"></div><canvas id="effects" aria-label="保护充气打工人的游玩区域"></canvas>
<header><a href="./index.html" class="brand">AIR / PLAY <span>下班保卫战</span></a><div class="tools"><select id="mouse-side" aria-label="鼠标模拟哪只脚蹬"><option value="left">鼠标 · 左脚蹬</option><option value="right">鼠标 · 右脚蹬</option></select><button id="sound" aria-label="开启音效">声音 关</button><button id="pause">暂停</button><button id="fullscreen">全屏 ↗</button></div></header>
<aside class="scoreboard"><span class="eyebrow">OFF THE CLOCK</span><div><strong id="score">0000</strong><small>分</small></div><p>已守护 <b id="time">00:00</b> <span> / </span> 第 <b id="wave">01</b> 波</p><div class="air-meter"><span>气量 <b id="air-label">100%</b></span><progress id="air" max="100" value="100" aria-label="气球人剩余气量"></progress></div><p class="best">最佳纪录 <b id="best">0</b></p></aside>
<div id="toast" role="status">今天，也要好好下班。</div>
<div class="energy"><div><span>必杀 · 喘口气</span><span id="charge-label">击退 0 / 6 解锁</span></div><progress id="charge" max="6" value="0" aria-label="清场蓄力"></progress></div>
<footer><button class="pedal left" id="left" aria-label="左脚蹬" aria-pressed="false"><span class="key">A</span><span><b>左脚蹬</b><small>点击踩踏 / A 键</small></span><i>↖</i></button><div class="footnote"><span id="input-status">鼠标模拟左脚蹬 · 360°移动</span><small>移动防护 · 点击重击 · 击退后连踩清场</small></div><button class="pedal right" id="right" aria-label="右脚蹬" aria-pressed="false"><i>↗</i><span><b>右脚蹬</b><small>点击切换模拟 / L 键</small></span><span class="key">L</span></button></footer>
<section id="overlay" class="overlay"><div class="card"><span class="eyebrow" id="card-tag">A LITTLE AIR. A LITTLE COURAGE.</span><h1 id="card-title">工作，<br>到此为止。</h1><p id="card-copy">被扎中会漏气，踩踏能补气。<br>鼠标 360°移动防护；点击击退重物。<br>击退 6 件后，再连续点击 6 次，必杀清场。</p><button id="start" class="primary">开始守护 ↗</button><p class="card-hint">当前鼠标模拟一只脚蹬 · 手柄支持双摇杆 + LT / RT</p></div></section>
</main></body></html>
