<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>下班健身操 · AIR / PLAY</title>  <script type="module" crossorigin src="./assets/play-BPmGhQEo.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/motion-expressions-bMRN8pNN.js">
  <link rel="stylesheet" crossorigin href="./assets/play-BcTOtOfN.css">
</head>
<body><main id="game"><div id="world" aria-hidden="true"></div><canvas id="effects" aria-label="保护充气打工人的游玩区域"></canvas>
<header><a href="./index.html" class="brand">AIR / PLAY <span>下班健身操</span></a><div class="tools"><button id="sound" aria-label="开启音效">声音 关</button><button id="pause">暂停</button><button id="fullscreen">全屏 ↗</button></div></header>
<aside class="scoreboard"><span class="eyebrow">OFF THE CLOCK</span><div><strong id="score">0000</strong><small>分</small></div><p>已守护 <b id="time">00:00</b> <span> / </span> 第 <b id="wave">01</b> 波</p><div class="air-meter"><span>气量 <b id="air-label">100%</b></span><progress id="air" max="100" value="100" aria-label="气球人剩余气量"></progress></div><p class="best">最佳纪录 <b id="best">0</b></p></aside>
<div id="move-cue" hidden aria-label="接下来的动作"></div><div id="toast" role="status">今天，也要好好下班。</div>
<div class="energy" hidden><div><span>必杀 · 喘口气</span><span id="charge-label">击退 0 / 6 解锁</span></div><progress id="charge" max="6" value="0" aria-label="清场蓄力"></progress></div>
<section id="overlay" class="overlay"><div class="card"><span class="eyebrow" id="card-tag">A LITTLE AIR. A LITTLE COURAGE.</span><h1 id="card-title">抖掉工作，<br>跟上节拍。</h1><p id="card-copy">物品从上、左、右袭来，看清动作符号。<br>看清左／右脚，到细圆环时按对应动作键。<br>连续命中积累必杀，解锁后连按空格清场。</p><button id="start" class="primary">开始跟拍 ↗</button><p class="card-hint">左脚 W/S/A/D · 右脚 I/K/J/L<br>前 / 后 / 左 / 右 · Q / U 旋转 · P 暂停</p></div></section>
</main></body></html>
