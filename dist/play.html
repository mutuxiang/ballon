<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>下班保卫战 · AIR / PLAY</title>  <script type="module" crossorigin src="./assets/play-BYfRwl_6.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/motion-expressions-bMRN8pNN.js">
  <link rel="stylesheet" crossorigin href="./assets/play-BryzmkCu.css">
</head>
<body><main id="game"><div id="world" aria-hidden="true"></div><canvas id="effects" aria-label="保护充气打工人的游玩区域"></canvas>
<header><a href="./index.html" class="brand">AIR / PLAY <span>下班保卫战</span></a><div class="tools"><button id="sound" aria-label="开启音效">声音 关</button><button id="pause">暂停</button><button id="fullscreen">全屏 ↗</button></div></header>
<aside class="scoreboard"><span class="eyebrow">OFF THE CLOCK</span><div><strong id="score">0000</strong><small>分</small></div><p>已守护 <b id="time">00:00</b> <span> / </span> 第 <b id="wave">01</b> 波</p><div class="air-meter"><span>气量 <b id="air-label">100%</b></span><progress id="air" max="100" value="100" aria-label="气球人剩余气量"></progress></div><p class="best">最佳纪录 <b id="best">0</b></p></aside>
<div id="toast" role="status">今天，也要好好下班。</div>
<div class="energy" hidden><div><span>必杀 · 喘口气</span><span id="charge-label">击退 0 / 6 解锁</span></div><progress id="charge" max="6" value="0" aria-label="清场蓄力"></progress></div>
<section id="overlay" class="overlay"><div class="card"><span class="eyebrow" id="card-tag">A LITTLE AIR. A LITTLE COURAGE.</span><h1 id="card-title">工作，<br>到此为止。</h1><p id="card-copy">工作会从四面袭来，注意边缘预警。<br>鼠标移动保护全身；点击击退重物。<br>击退 6 件后，再连续点击 6 次，必杀清场。</p><button id="start" class="primary">开始守护 ↗</button><p class="card-hint">当前鼠标模拟一只脚蹬 · 手柄支持双摇杆 + LT / RT</p></div></section>
</main></body></html>
