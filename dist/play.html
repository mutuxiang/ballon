<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>下班保卫战 · AIR / PLAY</title>  <script type="module" crossorigin src="./assets/play-bB83krEd.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/clothing-BsQRIaWu.js">
  <link rel="stylesheet" crossorigin href="./assets/play-DrAGzWAp.css">
</head>
<body><main id="game"><div id="world" aria-hidden="true"></div><canvas id="effects" aria-label="保护充气打工人的游玩区域"></canvas>
<header><a href="./index.html" class="brand">AIR / PLAY <span>下班保卫战</span></a><div class="tools"><button id="sound" aria-label="开启音效">声音 关</button><button id="pause">暂停</button><button id="fullscreen">全屏 ↗</button></div></header>
<aside class="scoreboard"><span class="eyebrow">OFF THE CLOCK</span><div><strong id="score">0000</strong><small>分</small></div><p>已守护 <b id="time">00:00</b> <span> / </span> 第 <b id="wave">01</b> 波</p><div class="air-meter"><span>气量 <b id="air-label">100%</b></span><progress id="air" max="100" value="100" aria-label="气球人剩余气量"></progress></div><p class="best">最佳纪录 <b id="best">0</b></p></aside>
<div id="toast" role="status">今天，也要好好下班。</div>
<div class="energy"><div><span>喘口气</span><span id="charge-label">交替踩踏 · 蓄力清场</span></div><progress id="charge" max="10" value="0" aria-label="清场蓄力"></progress></div>
<footer><button class="pedal left" id="left" aria-label="左脚蹬" aria-pressed="false"><span class="key">A</span><span><b>左脚蹬</b><small>鼠标左键 / 触摸</small></span><i>↖</i></button><div class="footnote">把工作踢开，把自己留下。<small>单踩退重物 · 交替蓄力 · P 暂停</small></div><button class="pedal right" id="right" aria-label="右脚蹬" aria-pressed="false"><i>↗</i><span><b>右脚蹬</b><small>鼠标右键 / 触摸</small></span><span class="key">L</span></button></footer>
<section id="overlay" class="overlay"><div class="card"><span class="eyebrow" id="card-tag">A LITTLE AIR. A LITTLE COURAGE.</span><h1 id="card-title">工作，<br>到此为止。</h1><p id="card-copy">被扎中会漏气，踩踏能补气。<br>长按挡轻物；图钉和 KPI 要踩一下击退。<br>交替踩踏 10 次，释放「喘口气」清场。</p><button id="start" class="primary">开始守护 ↗</button><p class="card-hint">A / L 或鼠标左右键 · 鼠标移动瞄准 · 可切换全屏</p></div></section>
</main></body></html>
