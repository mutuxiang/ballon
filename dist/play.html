<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>工作间隙 · AIR / BREAK</title>  <script type="module" crossorigin src="./assets/play-DBXXPXVH.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/skin-gradient-D6MkD2M7.js">
  <link rel="stylesheet" crossorigin href="./assets/skin-gradient-DO23CpcG.css">
  <link rel="stylesheet" crossorigin href="./assets/play-B7lvJo5L.css">
</head>
<body><main id="game" data-phase="ready"><div class="stage-tone" aria-hidden="true"></div><canvas id="pose-layer" aria-hidden="true"></canvas><div id="world" aria-hidden="true"></div><canvas id="effects" aria-label="保护充气打工人的游玩区域"></canvas>
<header><div class="tools"><button id="sound" aria-label="开启音效">声音 关</button><button id="pause">暂停</button><button id="fullscreen">全屏</button></div></header>
<aside class="scoreboard" aria-label="工作间隙活动记录">
  <div class="metric score-line"><span class="metric-label">活动积分</span><div class="metric-value"><strong id="score">0000</strong><small>分</small></div></div>
  <div class="metric wave-meter"><span class="metric-label">波次</span><div class="metric-value"><b id="wave">01</b><small>波</small></div></div>
  <div class="metric air-meter"><span class="metric-label">气量</span><div class="metric-value"><b id="air-label">100%</b></div><progress id="air" max="100" value="100" aria-label="气球人剩余气量"></progress></div>
  <div class="metric best"><span class="metric-label">个人最佳</span><div class="metric-value"><b id="best">0</b></div></div>
</aside>
<div class="energy" hidden aria-live="off"><div><span id="barrage-title">攻击大爆发</span><span id="charge-label">准备双脚</span></div><progress id="charge" max="12" value="0" aria-label="双脚交替踩踏蓄力"></progress><div class="barrage-feet"><span id="step-left">F 左脚</span><b>交替快踩</b><span id="step-right">H 右脚</span></div><p id="barrage-hint">按下后松开，再踩另一脚</p></div>
<aside id="coach" class="coach" aria-label="操作说明">
  <p id="coach-copy" role="status">物品到细圆环时，按它标记的动作。<br>左边来用左脚，右边来用右脚。</p>
  <button id="coach-action">知道了，开始 <small>空格</small></button>
</aside>
</main></body></html>
